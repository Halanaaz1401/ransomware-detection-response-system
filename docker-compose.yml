version: '3.8'

services:
  rdrs-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rdrs-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
